<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 85.6mm;
        height: 53.98mm;
        font-family: Arial, Helvetica, sans-serif;
        background: white;
        display: flex;
        flex-direction: column;
      }

      /* Grey Top Band */
      .top-band {
        background-color: #808080;
        height: 12mm;
        width: 100%;
      }

      /* Center Content */
      .center-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4mm;
        padding: 3mm;
      }

      .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2mm;
        text-align: center;
      }

      .school-logo {
        width: 24mm;
        height: 24mm;
        object-fit: contain;
        margin-bottom: 2mm;
      }

      /* Bottom Contact */
      .bottom-contact {
        height: 10mm;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 3mm;
        border-top: 0.5mm solid #e0e0e0;
      }

      .contact-text {
        font-size: 6pt;
        color: #666;
        margin-bottom: 0.5mm;
      }

      .contact-numbers {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3mm;
      }

      .contact-number {
        font-size: 6pt;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>

  <body>
    <!-- Grey Top Band -->
    <div class="top-band"></div>

    <!-- Center Content -->
    <div class="center-content">
      <div class="logo-container">
        <img
          src="{{SCHOOL_LOGO_URL}}"
          alt="School Logo"
          class="school-logo"
          onerror="this.src = '/logo.jpg'"
        />
      </div>
    </div>

    <!-- Bottom Contact -->
    <div class="bottom-contact">
      <div style="display: flex; flex-direction: column; align-items: center">
        <span class="contact-text">Contact Numbers:</span>
        <div class="contact-numbers">
          <span class="contact-number">0992023823</span>
          <span class="contact-number">0914151769</span>
        </div>
      </div>
    </div>
  </body>
</html>
