<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 85.6mm;
      height: 53.98mm;
      font-family: Arial, Helvetica, sans-serif;
      background: white;
      display: flex;
      flex-direction: column;
    }
    
    /* Grey Top Band */
    .top-band {
      background-color: #808080;
      height: 12mm;
      width: 100%;
    }
    
    /* Center Content */
    .center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3mm;
      padding: 5mm;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      gap: 3mm;
    }
    
    .school-logo {
      width: 12mm;
      height: 12mm;
      object-fit: contain;
    }
    
    .school-name {
      font-size: 8pt;
      font-weight: bold;
      color: #333;
    }
    
    /* Bottom Contact */
    .bottom-contact {
      height: 10mm;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3mm;
      border-top: 0.5mm solid #e0e0e0;
    }
    
    .contact-text {
      font-size: 6pt;
      color: #666;
    }
    
    .contact-number {
      font-size: 7pt;
      font-weight: bold;
      color: #333;
      margin-left: 1mm;
    }
  </style>
</head>
<body>
  <!-- Grey Top Band -->
  <div class="top-band"></div>
  
  <!-- Center Content -->
  <div class="center-content">
    <div class="logo-container">
      <img src="{{SCHOOL_LOGO_URL}}" alt="School Logo" class="school-logo" onerror="this.style.display='none';" />
      <div class="school-name">{{SCHOOL_NAME}}</div>
    </div>
  </div>
  
  <!-- Bottom Contact -->
  <div class="bottom-contact">
    <span class="contact-text">Contact number:</span>
    <span class="contact-number">{{SCHOOL_CONTACT}}</span>
  </div>
</body>
</html>
