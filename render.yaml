# render.yaml
services:
  - type: web
    name: school-system
    env: node
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
    plan: free
    autoDeploy: true
    region: oregon  # or your preferred region

  # PostgreSQL Database (optional - create manually in Render dashboard if preferred)
  - type: pspg
    name: school-db
    plan: free
    databaseName: school_db
    user: school_user