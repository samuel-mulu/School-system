services:
  - type: web
    name: school-system
    env: node
    region: oregon
    plan: free
    autoDeploy: true

    buildCommand: |
      npm install --include=dev
      npm run build
      npx prisma migrate deploy

    startCommand: node dist/server.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: FRONTEND_URL
        value: https://students-nine-tau.vercel.app

      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString

  - type: postgres
    name: school-db
    plan: free
    databaseName: school_db
    user: school_user
